<div class="card">
  <h2>{{ editing ? 'Edit Address' : 'Add New Address' }}</h2>

  <form [formGroup]="addressForm">
    <input placeholder="Street" formControlName="street">
    <input placeholder="City" formControlName="city">
    <input placeholder="Province" formControlName="province">
    <input placeholder="Postal Code" formControlName="postalCode">
    <input placeholder="Country" formControlName="country">

    <select formControlName="addressType">
      <option value="Shipping">Shipping</option>
      <option value="Billing">Billing</option>
    </select>
    <p>Modal is open</p>
    <label>
      Default?
      <input type="checkbox" formControlName="isDefault" />
    </label>

    <button class="primary" type="button" (click)="addOrUpdateAddress()">
      {{ editing ? 'Update Address' : 'Add Address' }}
    </button>

    <button class="secondary" type="button" (click)="cancel.emit()">Cancel</button>
  </form>
</div>
